<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool-List</title>
    <link rel="stylesheet" href="style.css">
    <script src="./scripts/db.js" defer></script>
    <script src="./script.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>Montage-Planer</h1>
        <p>Was steht heute an?</p>

        <div class="tasks-container">

            <div class="task-item">
                <input type="checkbox" id="task-window" value="window_installation">
                <label for="task-window">Fenster montage</label>
            </div>

            <div class="task-item">
                <input type="checkbox" id="task-door" value="indoor_installation">
                <label for="task-door">Innentür montage</label>
            </div>

            <div class="task-item">
                <input type="checkbox" id="task-kitchen" value="main_entrance_door_installation">
                <label for="task-kitchen">Haustür montage</label>
            </div>

            <div class="task-item">
                <input type="checkbox" id="task-baseboards" value="restoration">
                <label for="task-baseboards">Restaurierungsarbeiten</label>
            </div>
        </div>

        <button id="btn-packliste">Packliste erstellen</button>

        <div class="output-container">
            <h2>Deine Werkzeugliste:</h2>
            <ul id="output-list">
            </ul>

            <input type="text" id="input-extra-tool" placeholder="Zusätzliches Werkzeug...">
            <select id="select-category">
                <option value="window_installation">Fenster Montage</option>
                <option value="indoor_installation">Innentür Montage</option>
                <option value="main_entrance_door_installation">Haustür Montage</option>
                <option value="restoration">Restaurierungsarbeiten</option>
            </select>
            <button id="btn-add-extra-tool">Hinzufügen</button>
        </div>
    </main>
</body>

</html>
